<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan questions</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #e2e2dd; --accent: #2f6fd6; --accent-bg: #eaf1fd; --rec: #1f8a4c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1e; --text: #ededea; --muted: #a0a09a;
      --border: #33332f; --accent: #6b9ef0; --accent-bg: #1d2a40; --rec: #4cc584;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 120px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
       padding: 18px; margin-bottom: 16px; }
  .q h2 { font-size: 16px; margin: 0 0 6px; }
  .ctx { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
  .opt { display: block; border: 1px solid var(--border); border-radius: 8px;
         padding: 10px 12px; margin: 8px 0; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
  .opt input { margin-right: 8px; }
  .opt .desc { color: var(--muted); font-size: 14px; margin: 4px 0 0 24px; }
  .opt .preview { margin: 8px 0 0 24px; padding: 10px; border: 1px dashed var(--border);
                  border-radius: 6px; overflow-x: auto; }
  .rec { color: var(--rec); font-size: 12px; font-weight: 600; margin-left: 6px; }
  textarea { width: 100%; min-height: 44px; margin-top: 8px; padding: 8px; border-radius: 6px;
             border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
         border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 8px;
         justify-content: center; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); }
  #status { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">Chọn phương án cho từng câu. Bỏ trống = để agent tự quyết (dùng phương án đề xuất).</p>
  <div id="qs"></div>
</main>
<div class="bar">
  <button id="dl">Tải answers.json</button>
  <button id="cp" class="ghost">Copy</button>
  <span id="status"></span>
</div>
<script>
// AGENT: chỉ thay dòng DATA dưới đây. `preview` là HTML do agent viết; các trường khác được escape.
const DATA = {"feature": "example", "title": "Example feature", "questions": []};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("title").textContent = DATA.title;
document.title = "Questions — " + DATA.title;

document.getElementById("qs").innerHTML = DATA.questions.map(q => `
  <section class="q" data-id="${esc(q.id)}">
    <h2>${esc(q.question)}</h2>
    ${q.context ? `<p class="ctx">${esc(q.context)}</p>` : ""}
    ${q.options.map(o => `
      <label class="opt">
        <input type="${q.multi ? "checkbox" : "radio"}" name="${esc(q.id)}" value="${esc(o.label)}">
        <strong>${esc(o.label)}</strong>${o.recommended ? '<span class="rec">ĐỀ XUẤT</span>' : ""}
        ${o.description ? `<div class="desc">${esc(o.description)}</div>` : ""}
        ${o.preview ? `<div class="preview">${o.preview}</div>` : ""}
      </label>`).join("")}
    <textarea data-kind="other" placeholder="Khác (nếu không phương án nào phù hợp)"></textarea>
    <textarea data-kind="note" placeholder="Ghi chú thêm (tuỳ chọn)"></textarea>
  </section>`).join("");

function collect() {
  return {
    feature: DATA.feature,
    answers: DATA.questions.map(q => {
      const sec = document.querySelector(`section[data-id="${CSS.escape(q.id)}"]`);
      return {
        id: q.id,
        question: q.question,
        selected: [...sec.querySelectorAll("input:checked")].map(i => i.value),
        other: sec.querySelector('[data-kind="other"]').value.trim(),
        note: sec.querySelector('[data-kind="note"]').value.trim(),
      };
    }),
  };
}

const status = msg => { document.getElementById("status").textContent = msg; };

document.getElementById("dl").onclick = () => {
  const blob = new Blob([JSON.stringify(collect(), null, 2)], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `answers-${DATA.feature}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  status(`Đã tải ${a.download} — quay lại terminal báo agent.`);
};

document.getElementById("cp").onclick = async () => {
  try {
    await navigator.clipboard.writeText(JSON.stringify(collect()));
    status("Đã copy — dán vào terminal.");
  } catch {
    status("Không copy được, hãy dùng nút Tải.");
  }
};
</script>
</body>
</html>
